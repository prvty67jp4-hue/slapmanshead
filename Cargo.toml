[package]
name = "duel_arena"
version = "0.2.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
eframe = "0.37.0"
# replays are deflated (already in the build through zip)
flate2 = "1"
gilrs = "0.11"
glam = "0.34.3"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "hdr"] }
serde_json = "1"
sha2 = "0.10"
steamworks = "0.13.1"
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis", "mp3", "wav", "pcm"] }
# the auto-updater: HTTPS (rustls), and reading the release zips
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

